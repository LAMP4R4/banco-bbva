<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BBVA - Iniciar sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/estilos.css}" />
  </head>
  <body class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-4" style="width: 100%; max-width: 400px">
      <div class="text-center mb-4">
        <i class="bi bi-bank2 fs-1" style="color: var(--banco-azul)"></i>
        <h1 class="h4 fw-bold mt-2" style="color: var(--banco-azul)">Banco BBVA</h1>
      </div>

      <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

      <div
        th:if="${param.error}"
        class="alert alert-custom-danger d-flex align-items-center"
      >
        <i class="fa-solid fa-circle-exclamation fs-5"></i>
        <div>Usuario o contraseña incorrectos.</div>
      </div>
      <div
        th:if="${param.logout}"
        class="alert alert-custom-success d-flex align-items-center"
      >
        <i class="fa-solid fa-circle-check fs-5"></i>
        <div>Has cerrado sesión correctamente.</div>
      </div>

      <form th:action="@{/login}" method="POST" class="needs-validation">
        <div class="mb-3">
          <label for="usuario" class="form-label">Nombre de Usuario</label>
          <input
            type="text"
            id="userName"
            name="userName"
            class="form-control"
            placeholder="Ingresa tu usuario"
            required
          />
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" class="btn-banco w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
        </button>
      </form>

      <div class="text-center mt-3">
        <a
          href="#"
          class="small text-decoration-none"
          style="color: var(--banco-azul)"
        >
          ¿Olvidaste tu contraseña?
        </a>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
